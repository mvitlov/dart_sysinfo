# Reusable 9-cell Native Assets matrix (M2-02/M2-03).
# Keep matrix in sync with flutter-build in ci.yaml (PRD §7.2).
name: Native Assets Matrix

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-assets:
    name: Native Assets (${{ matrix.platform }}, Flutter ${{ matrix.flutter-version }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Latest (3.47.4): all 5 platforms ---
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: ios
            runs-on: macos-latest
            rust-targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
            build: cd example && flutter build ios --debug --no-codesign
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: macos
            runs-on: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build: cd example && flutter build macos --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: windows
            runs-on: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build: cd example; flutter build windows --debug
          # --- Minimum (3.38.1): android + linux spot-check ---
          - flutter-version: '3.38.1'
            sdk-tier: minimum
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.38.1'
            sdk-tier: minimum
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
          # --- Intermediate (3.44.0): android + linux spot-check ---
          - flutter-version: '3.44.0'
            sdk-tier: intermediate
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.44.0'
            sdk-tier: intermediate
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK r28+
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Assert NDK r28+
        if: matrix.platform == 'android'
        run: |
          NDK_MAJOR=$(grep '^Pkg.Revision' "${{ steps.setup-ndk.outputs.ndk-path }}/source.properties" | cut -d= -f2 | cut -d. -f1 | tr -d ' ')
          if [ "$NDK_MAJOR" -lt 28 ]; then
            echo "ERROR: NDK major version $NDK_MAJOR < 28"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "Confirmed: NDK r${NDK_MAJOR} installed."

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
          shared-key: native-assets-${{ matrix.platform }}-${{ matrix.flutter-version }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.flutter-version }}

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Materialize example ephemeral Flutter files
        run: cd example && flutter pub get

      - name: Build example app (Native Assets smoke)
        run: ${{ matrix.build }}

      - name: Verify Native Assets artifacts
        shell: bash
        run: bash tool/ci/verify_native_assets.sh ${{ matrix.platform }}
