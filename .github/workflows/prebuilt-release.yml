name: Prebuilt Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'prebuilt-v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  linux-x64:
    name: Build and publish linux-x64 prebuilt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
          shared-key: prebuilt-release

      - name: Build linux-x64 prebuilt
        run: bash tool/release/build_linux_prebuilt.sh dist/prebuilt/linux-x64

      - name: Extract semver from tag
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME#prebuilt-v}"
          else
            TAG="0.1.0"
          fi
          echo "semver=$TAG" >> "$GITHUB_OUTPUT"

      - name: Attest prebuilt artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/prebuilt/linux-x64/libdart_sysinfo_native.so

      - name: Verify attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify dist/prebuilt/linux-x64/libdart_sysinfo_native.so \
            --repo "${{ github.repository }}"

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/prebuilt/linux-x64/libdart_sysinfo_native.so
          generate_release_notes: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable

      - name: Update manifest.json
        if: github.ref_type == 'tag'
        run: |
          flutter pub get
          dart run tool/release/update_prebuilt_manifest.dart \
            --target linux-x64 \
            --file dist/prebuilt/linux-x64/libdart_sysinfo_native.so \
            --url "https://github.com/${{ github.repository }}/releases/download/prebuilt-v${{ steps.version.outputs.semver }}/libdart_sysinfo_native.so" \
            --repository "${{ github.repository }}" \
            --package-version "${{ steps.version.outputs.semver }}" \
            --abi 3

      - name: Commit manifest update
        if: github.ref_type == 'tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/dart_sysinfo/prebuilt/manifest.json
          if git diff --cached --quiet; then
            echo "manifest unchanged"
            exit 0
          fi
          git commit -m "chore(prebuilt): update linux-x64 manifest for prebuilt-v${{ steps.version.outputs.semver }}"
          git push
