name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'docs/sunset-clock/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.cursor/**'
      - 'docs/sunset-clock/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dart-only-test:
    name: Flutter-free core (${{ matrix.dart-image }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Flutter-free containers have no Rust; hook/build.dart no-ops (M0/M2).
      DART_SYSINFO_SKIP_NATIVE_ASSETS_HOOK: '1'
    container:
      image: ${{ matrix.dart-image }}
    strategy:
      fail-fast: false
      matrix:
        # PRD §7.2 SDK tiers (paired with flutter-build Flutter versions).
        dart-image:
          - 'dart:3.10.0'   # minimum (~Flutter 3.38.x)
          - 'dart:3.12.2'   # intermediate (~Flutter 3.44.x)
          - 'dart:3.13.3'   # latest (~Flutter 3.47.4)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Assert environment is Flutter-free
        run: |
          if command -v flutter >/dev/null 2>&1; then
            echo "ERROR: Flutter SDK detected in Flutter-free test container."
            exit 1
          fi
          echo "Confirmed: Flutter is NOT installed."
          dart --version

      - name: Assert packages/dart_sysinfo/pubspec.yaml is Flutter-free
        run: |
          if grep -q "sdk: flutter" packages/dart_sysinfo/pubspec.yaml; then
            echo "ERROR: 'sdk: flutter' found in packages/dart_sysinfo/pubspec.yaml"
            exit 1
          fi
          if grep -A 2 "^environment:" packages/dart_sysinfo/pubspec.yaml | grep -q "flutter:"; then
            echo "ERROR: 'environment: flutter' found in packages/dart_sysinfo/pubspec.yaml"
            exit 1
          fi
          echo "Confirmed: packages/dart_sysinfo/pubspec.yaml has no Flutter SDK constraints."

      - name: Assert pubspec platforms exclude web (PRD §1.6)
        run: |
          for pubspec in packages/dart_sysinfo/pubspec.yaml packages/dart_sysinfo_flutter/pubspec.yaml; do
            if grep -A 10 "^platforms:" "$pubspec" | grep -Ev '^\s*#' | grep -qE '^\s+web\s*:'; then
              echo "ERROR: 'web:' platform found in $pubspec"
              exit 1
            fi
          done
          echo "Confirmed: web is excluded from all package platforms declarations."

      - name: Resolve dependencies in packages/dart_sysinfo
        run: |
          cd packages/dart_sysinfo
          printf 'resolution:\n' > pubspec_overrides.yaml
          dart pub get

      - name: Run Dart tests in packages/dart_sysinfo
        run: |
          cd packages/dart_sysinfo
          dart test

      - name: Run domain generator tests (M3-01)
        if: matrix.dart-image == 'dart:3.13.3'
        run: |
          dart pub get
          dart test tool/test

      - name: Check domain completeness (M3-02)
        if: matrix.dart-image == 'dart:3.13.3'
        run: dart run tool/ci/check_domain_completeness.dart

      # Standalone pub.dev consumer sim is expensive; once on latest Dart is enough.
      - name: Verify standalone package resolution (pub.dev consumer simulation)
        if: matrix.dart-image == 'dart:3.13.3'
        run: |
          mkdir -p /tmp/pkg_standalone
          cp -r packages/dart_sysinfo /tmp/pkg_standalone/
          rm -rf /tmp/pkg_standalone/dart_sysinfo/.dart_tool
          cd /tmp/pkg_standalone/dart_sysinfo
          sed -i '/resolution: workspace/d' pubspec.yaml
          rm -f pubspec_overrides.yaml
          dart pub get
          dart test --exclude-tags=monorepo

  lint:
    name: Lint (very_good_analysis, zero warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
          cache-key: flutter-3.47.4

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Check domain completeness (M3-02)
        run: dart run tool/ci/check_domain_completeness.dart

      - name: Analyze workspace (zero warnings)
        run: dart analyze --fatal-warnings .

  flutter-build:
    name: Flutter build (${{ matrix.platform }}, Flutter ${{ matrix.flutter-version }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      # Keep in sync with native-assets-matrix.yml (PRD §7.2).
      matrix:
        include:
          # --- Latest (3.47.4): all 5 platforms ---
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: ios
            runs-on: macos-latest
            rust-targets: aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
            build: cd example && flutter build ios --debug --no-codesign
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: macos
            runs-on: macos-latest
            rust-targets: aarch64-apple-darwin x86_64-apple-darwin
            build: cd example && flutter build macos --debug
          - flutter-version: '3.47.4'
            sdk-tier: latest
            platform: windows
            runs-on: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            build: cd example; flutter build windows --debug
          # --- Minimum (3.38.1): android + linux spot-check ---
          # 3.38.0 shipped Dart 3.10.0-beta and fails pub get with sdk: >=3.10.0.
          - flutter-version: '3.38.1'
            sdk-tier: minimum
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.38.1'
            sdk-tier: minimum
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
          # --- Intermediate (3.44.0): android + linux spot-check ---
          - flutter-version: '3.44.0'
            sdk-tier: intermediate
            platform: android
            runs-on: ubuntu-latest
            rust-targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
            build: cd example && flutter build apk --debug
          - flutter-version: '3.44.0'
            sdk-tier: intermediate
            platform: linux
            runs-on: ubuntu-latest
            rust-targets: x86_64-unknown-linux-gnu
            build: cd example && flutter build linux --debug
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up JDK 17 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android NDK r28+
        if: matrix.platform == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Assert NDK r28+
        if: matrix.platform == 'android'
        run: |
          NDK_MAJOR=$(grep '^Pkg.Revision' "${{ steps.setup-ndk.outputs.ndk-path }}/source.properties" | cut -d= -f2 | cut -d. -f1 | tr -d ' ')
          if [ "$NDK_MAJOR" -lt 28 ]; then
            echo "ERROR: NDK major version $NDK_MAJOR < 28"
            exit 1
          fi
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "Confirmed: NDK r${NDK_MAJOR} installed."

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
          shared-key: flutter-build-${{ matrix.platform }}-${{ matrix.flutter-version }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter-version }}
          channel: stable
          cache: true
          cache-key: flutter-${{ matrix.flutter-version }}

      - name: Resolve workspace dependencies
        run: flutter pub get

      - name: Materialize example ephemeral Flutter files
        run: cd example && flutter pub get

      - name: Smoke-test dart_sysinfo:doctor
        if: matrix.platform == 'android' && matrix.flutter-version == '3.47.4'
        run: dart run dart_sysinfo:doctor
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Build example app (Cargokit + FRB smoke)
        run: ${{ matrix.build }}

  native-assets:
    uses: ./.github/workflows/native-assets-matrix.yml
    secrets: inherit

  rust-test:
    name: Rust tests (packages/native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native
          shared-key: rust-test

      - name: Run Rust integration tests
        run: cd packages/native && cargo test -- --test-threads=1

  m0-exit-gate:
    name: M1 P1 CI gate (PRD §7.2)
    # native-assets is intentionally excluded: parallel track per PRD §7.2 / M2-02.
    needs: [dart-only-test, lint, flutter-build, rust-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert all P1 CI jobs passed
        env:
          DART_ONLY: ${{ needs.dart-only-test.result }}
          LINT: ${{ needs.lint.result }}
          FLUTTER_BUILD: ${{ needs.flutter-build.result }}
          RUST_TEST: ${{ needs.rust-test.result }}
        run: |
          echo "dart-only-test=$DART_ONLY lint=$LINT flutter-build=$FLUTTER_BUILD rust-test=$RUST_TEST"
          failed=false
          for result in "$DART_ONLY" "$LINT" "$FLUTTER_BUILD" "$RUST_TEST"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job result: $result"
              failed=true
            fi
          done
          if [ "$failed" = true ]; then
            echo "M1 P1 CI gate NOT met."
            exit 1
          fi
          echo "M1 P1 CI gate met (all SDK tiers + rust tests)."
