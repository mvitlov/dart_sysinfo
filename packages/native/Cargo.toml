[package]
name = "dart_sysinfo_native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
sysinfo = { version = "0.39", default-features = false }
flutter_rust_bridge = "=2.13.0"

[features]
default = ["system"]
system = ["sysinfo/system"]
disk = ["sysinfo/disk"]
network = ["sysinfo/network"]
component = ["sysinfo/component"]
apple-app-store = ["sysinfo/apple-app-store"]

[[test]]
name = "apple_app_store"
path = "tests/apple_app_store.rs"
required-features = ["apple-app-store"]
