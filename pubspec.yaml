name: dart_sysinfo_workspace
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"

workspace:
  - packages/dart_sysinfo
  - packages/dart_sysinfo_flutter
  - example

dev_dependencies:
  melos: ^7.0.0
  test: ^1.25.0
  very_good_analysis: ^7.0.0

melos:
  # Use the FVM-pinned SDK (.fvmrc) instead of whatever flutter/dart happens
  # to be first on PATH — see PRD §1.5 (Development SDK: Flutter 3.47.4 / Dart 3.13.3).
  sdkPath: .fvm/flutter_sdk

  scripts:
    analyze:
      run: dart analyze --fatal-warnings .
    doctor:
      run: dart run dart_sysinfo:doctor
    frb:generate:
      run: cd packages/dart_sysinfo && flutter_rust_bridge_codegen generate
    new-domain:
      run: dart run tool/new_domain.dart
    test:generator:
      run: dart test tool/test

  command:
    version:
      mode: fixed
      workspaceTag: true
